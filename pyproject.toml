[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "setuptools_scm[toml]", "wheel"]


[project]
name = "torchsim"
description = "A feature-rich MR simulator supporting massive parallelization on GPU and automatic differentiation."
readme = "README.rst"

requires-python = ">=3.10"
dynamic = ["version"]

license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["epg", "mri", "simulation", "bloch"]


authors = [
  {name = "Matteo Cencini", email = "matteo.cencini@gmail.com" } # Optional
]

# Classifiers help users find your project by categorizing it.
# For a list of valid classifiers, see https://pypi.org/classifiers/
classifiers = [  # Optional
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  # Specify the Python versions you support here. In particular, ensure
  # that you indicate you support Python 3. These classifiers are *not*
  # checked by "pip install". See instead "python_requires" below.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
# NumPy 2.0 renamed ``trapz`` to ``trapezoid`` and is the baseline for the
# array API used across the simulator.
"numpy>=2.0",
"scipy>=1.10",
# torch.func (jacrev/jacfwd) and torch.linalg are used by the optimization and
# estimator packages.
"torch>=2.1",
]

[project.optional-dependencies] # Optional
dev = ["black", "isort", "ruff"]
test = [
"pytest>=7.0",
"pytest-black",
"pytest-cov",
"pytest-sugar",
"pytest-xdist",
]
doc = [
"sphinx>=7.0",
"sphinx_book_theme>=1.1",
"sphinx-gallery>=0.15",
"sphinx-exec-directive>=0.6",
"sphinx_copybutton>=0.5",
"matplotlib>=3.8",
"sigpy>=0.1.26",
"torchio>=0.19",
"ipywidgets>=8.0",
]

# List URLs that are relevant to your project
# This field corresponds to the "Project-URL" and "Home-Page" metadata fields:
[project.urls]  # Optional
"Homepage" = "https://github.com/INFN-MRI/torchsim"
"Bug Reports" = "https://github.com/INFN-MRI/torchsim/issues"
"Source" = "https://github.com/INFN-MRI/torchsim"

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.exclude-package-data]
torchsim = ["*.cpp"]

[tool.setuptools_scm]
write_to = "src/torchsim/_version.py"
version_scheme = "python-simplified-semver"
local_scheme="no-local-version"
fallback_version="v99-dev"

# Formatting using black.
[tool.black]

[tool.isort]
profile="black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--cov=torchsim",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-m", "not interpreted"
]
markers = [
    "interpreted: runs a kernel in Triton's CPU interpreter; a minute each"
]

# linting using ruff.
[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "Q", "D", "UP", "ANN"]

ignore = [
    "ANN204", # missing return type for __init__
    "D105", # missing docstring in magic method
    "D404", # Imperative mode is not necessary everywhere, trust me.
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN"]
"src/torchsim/estimators/_perk.py" = ["ANN401"]
"src/torchsim/sequence/_accelerators.py" = ["ANN401"]
"src/torchsim/sequence/_builders.py" = ["ANN401"]
"src/torchsim/sequence/_description.py" = ["ANN401"]
"src/torchsim/sequence/_epg_triton.py" = ["ANN"]
"src/torchsim/sequence/_operators.py" = ["ANN401"]
"src/torchsim/sequence/_simulation.py" = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
ignore_missing_imports = true
