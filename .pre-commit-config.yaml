# What CI runs, so a push cannot fail a check the working tree already passed.
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
ci:
  autoupdate_schedule: monthly

exclude: ^src/torchsim/_version\.py$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.seq$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # A .seq file is written by Pulseq, which puts a trailing space after
        # every definition. It is a data file, not source, and is kept as its
        # writer emits it.
        exclude: \.seq$

  # The formatter and the linter, in that order: format first so the linter
  # judges the code as it will be committed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]
