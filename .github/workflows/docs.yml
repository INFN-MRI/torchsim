name: Docs

# Every branch, so a check cannot first fail on the pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  html:
    name: HTML
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version out of the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # What .readthedocs.yaml builds the published pages with.
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # The default index serves the CUDA build on Linux, which is gigabytes
      # of driver libraries a runner with no card cannot use.
      - name: Install PyTorch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The ``doc`` extra alone, which is what the hosted builder installs:
      # this job is that build, run on every branch rather than on a release.
      # The examples reaching outside it are rendered from their source.
      - name: Build the extensions and install
        run: python -m pip install ".[doc]"

      - name: Build the HTML
        run: bash scripts/build_docs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/build/html
          retention-days: 7
