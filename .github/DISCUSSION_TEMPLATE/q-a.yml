labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What you are trying to do
      description: |
        The sequence or the analysis, and where you got stuck. If a signal
        looks wrong, say what you expected it to look like and why.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: What you have so far
      description: The call you are making, if there is one.
      render: python

  - type: input
    id: version
    attributes:
      label: TorchSim version
      placeholder: "0.4.1, or the commit you are on"
